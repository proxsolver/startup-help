name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 배포 도구는 부동 태그(@v5) 대신 커밋 해시로 고정합니다. 태그는 누가 언제 다시 붙이는지 모르므로,
      # 같은 워크플로가 다른 코드를 실행하는 사고(공급망)를 여기서 막습니다. 갱신은 dependabot 이 제안합니다.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 콘텐츠 게이트: 출처 없는 문서, 검증 대기 문서의 법적 수치, 섞임 문자, 끊긴 내부 링크를 여기서 잡는다.
      - name: Check content
        run: npm run check:content

      # 타입 검사: 화면 스크립트의 변수 중복·non-standard API 같은, 단위 테스트가 못 잡는 오류.
      - name: Type check
        run: npx astro check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # 배포될 파일 단위 점검: 끊긴 내부 링크 0건, 모든 화면 제목에 (비공식).
      - name: Check build output
        run: npm run check:dist

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
