name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 배포 도구는 부동 태그(@v5) 대신 커밋 해시로 고정합니다. 태그는 누가 언제 다시 붙이는지 모르므로,
      # 같은 워크플로가 다른 코드를 실행하는 사고(공급망)를 여기서 막습니다. 갱신은 dependabot 이 제안합니다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 콘텐츠 게이트: 출처 없는 문서, 검증 대기 문서의 법적 수치, 섞임 문자, 끊긴 내부 링크를 여기서 잡는다.
      - name: Check content
        run: npm run check:content

      # 타입 검사: 화면 스크립트의 변수 중복·non-standard API 같은, 단위 테스트가 못 잡는 오류.
      - name: Type check
        run: npx astro check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # 배포될 파일 단위 점검: 끊긴 내부 링크 0건, 모든 화면 제목에 (비공식).
      - name: Check build output
        run: npm run check:dist

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
